name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The demo is a static page: HTML, CSS, JS, two ONNX graphs and a few
      # PNGs. Nothing is built, so there is no toolchain to pin.
      - name: Check the model artefacts are present
        run: |
          test -f site/model/model.onnx || {
            echo "site/model/model.onnx is missing -- run tools/export_onnx.py"; exit 1; }
          test -f site/model/model_meta.json || {
            echo "site/model/model_meta.json is missing"; exit 1; }
          test -f site/model/unet.onnx || {
            echo "site/model/unet.onnx is missing -- run tools/export_unet_onnx.py"; exit 1; }
          test -f site/model/unet_meta.json || {
            echo "site/model/unet_meta.json is missing"; exit 1; }
          ls -lh site/model

      # The runtime is vendored rather than fetched from a CDN, so a missing
      # file here is a page that cannot run anything -- and the .js bundle and
      # the .wasm binary have to travel together or the loader fails at the
      # point where it instantiates the module.
      - name: Check the vendored runtime is present
        run: |
          for f in ort.wasm.min.js ort-wasm-simd-threaded.wasm \
                   ort-wasm-simd-threaded.mjs; do
            test -s "site/vendor/onnxruntime-web/$f" || {
              echo "site/vendor/onnxruntime-web/$f is missing -- see the README there"
              exit 1; }
          done
          grep -q 'vendor/onnxruntime-web/ort.wasm.min.js' site/index.html || {
            echo "index.html does not load the vendored runtime"; exit 1; }
          ! grep -q 'cdn.jsdelivr.net' site/index.html site/app.js || {
            echo "a CDN reference is back in the page"; exit 1; }
          ls -lh site/vendor/onnxruntime-web

      # Pages rejects an artefact over 1 GB, and a page nobody can load is a
      # failed deploy whatever the size limit says. Fail here with a readable
      # message rather than in the browser.
      - name: Check the payload is servable
        run: |
          total=$(du -sm site | cut -f1)
          echo "site payload: ${total} MB"
          test "$total" -lt 400 || {
            echo "site/ is ${total} MB -- too heavy for a demo page"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
