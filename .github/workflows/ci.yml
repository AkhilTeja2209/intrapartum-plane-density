name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU torch keeps the runner install under a couple of minutes; the
      # synthetic smoke test never touches a GPU.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scikit-learn Pillow PyYAML opencv-python-headless matplotlib tqdm

      # Runs the whole pipeline on 20 synthetic videos: label parsing, index
      # build, splits, sampling, metrics, both training arms, analyze. Stage 0
      # guards the ALL-sentinel and doubled-stem label-join defects.
      - name: Synthetic smoke test
        run: python -m src.smoke_test --synthetic
