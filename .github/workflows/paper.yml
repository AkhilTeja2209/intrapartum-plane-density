name: Paper

# The paper cites numbers that live in this repository, so a build that breaks
# should be as visible as a test that breaks. There is no TeX distribution on
# the development machine, so CI is the only place the LaTeX is actually
# compiled -- treat a red run here as "the paper does not build", not as
# infrastructure noise.
on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "docs/demo.png"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "docs/demo.png"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The first version of this job installed TeX with apt and hung for over
    # 11 minutes on a slow mirror, having compiled the identical source in
    # 2m46s the run before. A build that can hang indefinitely on someone
    # else's mirror is not a usable check, so cap it: a hang now fails in a
    # bounded time rather than occupying a runner for six hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # TeX now comes from a prebuilt image rather than apt, which removes the
      # mirror from the critical path entirely -- there is no apt-get update to
      # hang on. The image is pulled from a registry and cached by the runner
      # infrastructure between jobs. latexmk runs pdflatex as many times as the
      # cross-references need, which is what the two hand-written passes were
      # emulating, and it fails the job on a LaTeX error.
      - name: Build
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false

      # Undefined references and overfull boxes do not fail the build, so
      # surface them rather than letting them pass unseen. latexmk resolves
      # references across passes, so anything still undefined here is real.
      - name: Report warnings
        working-directory: paper
        run: |
          echo "--- undefined references / citations ---"
          grep -n "undefined" main.log || echo "none"
          echo "--- overfull boxes ---"
          grep -c "Overfull" main.log || echo "0"

      # A missing PDF with a green tick would be worse than a red one.
      - name: Check the PDF exists
        working-directory: paper
        run: |
          test -s main.pdf
          echo "main.pdf $(stat -c%s main.pdf) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf
